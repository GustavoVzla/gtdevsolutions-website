<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot WhatsApp - Glamour Studio | Prototipo GT Dev Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0B141A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

/* ── Phone Frame ── */
.phone{width:375px;height:812px;background:#0B141A;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);border:3px solid #2A2A2E;position:relative;display:flex;flex-direction:column}
.phone-notch{width:150px;height:28px;background:#0B141A;border-radius:0 0 18px 18px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:20}
.phone-status-bar{height:44px;background:#075E54;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 4px;font-size:12px;color:#fff;font-weight:600;position:relative;z-index:10}

/* ── WhatsApp Header ── */
.wa-header{background:#075E54;padding:8px 12px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.wa-back{color:#fff;font-size:20px;cursor:pointer;padding:4px}
.wa-profile-pic{width:40px;height:40px;border-radius:50%;background:url('https://images.unsplash.com/photo-1560066984-138dadb4c035?w=80&h=80&fit=crop&q=80') center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;flex-shrink:0}
.wa-header-info{flex:1}
.wa-header-name{color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.wa-verified{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:#25D366;border-radius:50%;color:#fff;font-size:10px;font-weight:700}
.wa-header-status{color:rgba(255,255,255,.7);font-size:12px}
.wa-header-actions{display:flex;gap:16px}
.wa-header-actions span{color:#fff;font-size:18px;cursor:pointer}

/* ── Business Info Card ── */
.wa-business-card{background:#075E54;padding:0 16px 12px;display:none}
.wa-business-card.show{display:block}
.wa-bcard-inner{background:rgba(255,255,255,.1);border-radius:10px;padding:12px 16px}
.wa-bcard-row{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.85);font-size:13px;margin-bottom:8px}
.wa-bcard-row:last-child{margin-bottom:0}
.wa-bcard-icon{font-size:16px;width:24px;text-align:center}

/* ── Chat Area ── */
.wa-chat{flex:1;overflow-y:auto;padding:12px 16px;position:relative}
.wa-chat::-webkit-scrollbar{width:4px}
.wa-chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}

/* WhatsApp pattern background */
.wa-chat::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0}

.wa-chat > *{position:relative;z-index:1}

.wa-date-divider{text-align:center;margin:8px 0 16px}
.wa-date-divider span{background:rgba(32,45,52,.9);color:rgba(255,255,255,.6);font-size:12px;padding:4px 12px;border-radius:8px}

.wa-msg{max-width:82%;margin-bottom:4px;animation:wa-appear .3s ease-out}
@keyframes wa-appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wa-msg-received{float:left;clear:both}
.wa-msg-sent{float:right;clear:both}
.wa-msg-bubble{padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.45;position:relative;word-wrap:break-word}
.wa-msg-received .wa-msg-bubble{background:#1F2C33;color:#E9EDEF;border-top-left-radius:0}
.wa-msg-sent .wa-msg-bubble{background:#005C4B;color:#E9EDEF;border-top-right-radius:0}
.wa-msg-time{font-size:11px;color:rgba(255,255,255,.45);float:right;margin:-4px 0 -4px 8px;padding-top:4px}
.wa-msg-check{font-size:14px;color:#53BDEB;margin-left:2px}
.clearfix{clear:both;height:8px}

/* Interactive List */
.wa-list{margin-top:8px}
.wa-list-btn{display:block;width:100%;background:transparent;border:1px solid rgba(0,168,132,.5);color:#00A884;border-radius:8px;padding:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center;margin-bottom:6px}
.wa-list-btn:hover{background:rgba(0,168,132,.1);border-color:#00A884}
.wa-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .2s;margin-bottom:4px;background:rgba(255,255,255,.05)}
.wa-list-item:hover{background:rgba(255,255,255,.1)}
.wa-list-icon{font-size:20px;width:32px;text-align:center}
.wa-list-text{font-size:14px;color:#E9EDEF}
.wa-list-desc{font-size:12px;color:rgba(255,255,255,.5)}

/* Calendar */
.wa-calendar{background:rgba(255,255,255,.05);border-radius:10px;padding:12px;margin-top:8px}
.wa-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wa-cal-header span{color:#E9EDEF;font-size:14px;font-weight:600}
.wa-cal-header button{background:none;border:none;color:#00A884;font-size:16px;cursor:pointer;padding:4px 8px}
.wa-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wa-cal-day{font-size:11px;color:rgba(255,255,255,.4);padding:4px;font-weight:600}
.wa-cal-num{font-size:13px;color:rgba(255,255,255,.7);padding:6px 4px;border-radius:50%;cursor:pointer;transition:all .2s}
.wa-cal-num:hover{background:rgba(0,168,132,.2);color:#00A884}
.wa-cal-num.available{color:#E9EDEF;font-weight:600}
.wa-cal-num.selected{background:#00A884;color:#fff}
.wa-cal-num.empty{visibility:hidden}

/* Confirmation */
.wa-confirmation{background:rgba(0,168,132,.1);border:1px solid rgba(0,168,132,.3);border-radius:10px;padding:14px;margin-top:8px}
.wa-conf-title{color:#00A884;font-weight:600;font-size:14px;margin-bottom:8px}
.wa-conf-row{display:flex;justify-content:space-between;font-size:13px;color:#E9EDEF;margin-bottom:4px}
.wa-conf-row span:first-child{color:rgba(255,255,255,.5)}

/* Typing */
.wa-typing{float:left;clear:both;display:flex;gap:4px;padding:12px 16px;background:#1F2C33;border-radius:8px;border-top-left-radius:0;margin-bottom:8px}
.wa-typing span{width:7px;height:7px;background:rgba(255,255,255,.3);border-radius:50%;animation:wa-type .8s infinite}
.wa-typing span:nth-child(2){animation-delay:.15s}
.wa-typing span:nth-child(3){animation-delay:.3s}
@keyframes wa-type{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* Input Bar */
.wa-input-bar{background:#1F2C33;padding:8px 10px;display:flex;align-items:center;gap:8px}
.wa-input-icons{color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:4px;transition:color .2s}
.wa-input-icons:hover{color:rgba(255,255,255,.8)}
.wa-input-field{flex:1;background:#2A3942;border:none;border-radius:24px;padding:10px 16px;color:#E9EDEF;font-size:14px;font-family:inherit;outline:none}
.wa-input-field::placeholder{color:rgba(255,255,255,.35)}
.wa-send-btn{width:42px;height:42px;background:#00A884;border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.wa-send-btn:hover{background:#008F72}

.watermark{position:fixed;bottom:8px;left:16px;font-size:11px;color:rgba(255,255,255,.3)}
.page-title{color:rgba(255,255,255,.6);font-size:13px;text-align:center;margin-bottom:16px}
</style>
</head>

<div class="phone">

<script>
const waChat = document.getElementById('waChat');
const waInput = document.getElementById('waInput');
let step = 0;

function toggleBusinessCard(){
  document.getElementById('businessCard').classList.toggle('show');
}

function scrollChat(){waChat.scrollTop = waChat.scrollHeight}

function addDateDivider(text){
  const d = document.createElement('div');
  d.className = 'wa-date-divider';
  d.innerHTML = '<span>'+text+'</span>';
  waChat.appendChild(d);
}

function addMsg(text, type, delay){
  return new Promise(resolve => {
    if(type === 'received'){
      const t = document.createElement('div');
      t.className = 'wa-typing';
      t.innerHTML = '<span></span><span></span><span></span>';
      waChat.appendChild(t);
      waChat.appendChild(createClearfix());
      scrollChat();
      setTimeout(() => {
        t.remove();
        const prev = waChat.querySelector('.clearfix:last-of-type');
        if(prev) prev.remove();
        renderMsg(text, type);
        resolve();
      }, delay || 1000);
    } else {
      renderMsg(text, type);
      resolve();
    }
  });
}

function renderMsg(text, type){
  const msg = document.createElement('div');
  msg.className = 'wa-msg wa-msg-' + type;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const check = type === 'sent' ? '<span class="wa-msg-check">&#10003;&#10003;</span>' : '';
  msg.innerHTML = '<div class="wa-msg-bubble">' + text + '<span class="wa-msg-time">' + time + ' ' + check + '</span></div>';
  waChat.appendChild(msg);
  waChat.appendChild(createClearfix());
  scrollChat();
}

function createClearfix(){
  const c = document.createElement('div');
  c.className = 'clearfix';
  return c;
}

function addServiceList(){
  const wrapper = document.createElement('div');
  wrapper.className = 'wa-msg wa-msg-received';
  wrapper.innerHTML = `
    <div class="wa-msg-bubble">
      Que servicio te interesa? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
      <div class="wa-list">
        <div class="wa-list-item" onclick="selectService('corte','Corte y Peinado')">
          <span class="wa-list-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg></span>
          <div><div class="wa-list-text">Corte y Peinado</div><div class="wa-list-desc">Desde 25 euros</div></div>

          <span class="wa-list-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/></svg></span>
          <div><div class="wa-list-text">Color y Mechas</div><div class="wa-list-desc">Desde 55 euros</div></div>
        </div>

        </div>

          <div><div class="wa-list-text">Paquetes Especiales</div><div class="wa-list-desc">Combos con descuento</div></div>
        </div>
      </div>
      <span class="wa-msg-time">10:26</span>
    </div>`;

  waChat.appendChild(createClearfix());
  scrollChat();

function addCalendar(){
  const wrapper = document.createElement('div');
  wrapper.className = 'wa-msg wa-msg-received';
  wrapper.innerHTML = `
    <div class="wa-msg-bubble">
      Genial! Estas son las fechas disponibles esta semana:

        <div class="wa-cal-grid">
          <div class="wa-cal-day">L</div><div class="wa-cal-day">M</div><div class="wa-cal-day">X</div>
          <div class="wa-cal-day">J</div><div class="wa-cal-day">V</div><div class="wa-cal-day">S</div>

          <div class="wa-cal-num empty"></div><div class="wa-cal-num empty"></div><div class="wa-cal-num empty"></div>
          <div class="wa-cal-num empty"></div><div class="wa-cal-num empty"></div><div class="wa-cal-num empty"></div>
          <div class="wa-cal-num">1</div>
          <div class="wa-cal-num">2</div><div class="wa-cal-num">3</div><div class="wa-cal-num">4</div>
          <div class="wa-cal-num">5</div><div class="wa-cal-num">6</div><div class="wa-cal-num">7</div>

          <div class="wa-cal-num">17</div><div class="wa-cal-num">18</div>
          <div class="wa-cal-num">19</div>
          <div class="wa-cal-num available" onclick="selectDate(this,20)">20</div>
          <div class="wa-cal-num available" onclick="selectDate(this,21)">21</div>
          <div class="wa-cal-num available" onclick="selectDate(this,22)">22</div>
          <div class="wa-cal-num">23</div>
          <div class="wa-cal-num available" onclick="selectDate(this,24)">24</div>
          <div class="wa-cal-num available" onclick="selectDate(this,25)">25</div>
          <div class="wa-cal-num available" onclick="selectDate(this,26)">26</div>
          <div class="wa-cal-num available" onclick="selectDate(this,27)">27</div>
          <div class="wa-cal-num available" onclick="selectDate(this,28)">28</div>
        </div>
      </div>
      <span class="wa-msg-time">10:27</span>
    </div>`;
  waChat.appendChild(wrapper);
  waChat.appendChild(createClearfix());
  scrollChat();
}

function addTimeSlots(){
  const wrapper = document.createElement('div');
  wrapper.className = 'wa-msg wa-msg-received';
  wrapper.innerHTML = `
    <div class="wa-msg-bubble">
      Horarios disponibles para ese dia:
      <div class="wa-list" style="margin-top:8px">
        <div class="wa-list-item" onclick="selectTime('10:00')">
          <span class="wa-list-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <div class="wa-list-text">10:00</div>
        </div>

          <div class="wa-list-text">18:30</div>

      </div>
      <span class="wa-msg-time">10:27</span>

}

let selectedService = '';
let selectedDate = '';

async function selectService(key, label){
  selectedService = label;
  step = 2;
  await addMsg(label, 'sent', 0);
  setTimeout(() => addCalendar(), 1000);
}

async function selectDate(el, day){
  document.querySelectorAll('.wa-cal-num').forEach(n => n.classList.remove('selected'));
  el.classList.add('selected');
  selectedDate = day + ' de febrero';
  step = 3;
  await addMsg('El dia ' + day + ' de febrero', 'sent', 0);
  setTimeout(() => addTimeSlots(), 1000);
}

async function selectTime(time){
  step = 4;
  await addMsg(time, 'sent', 0);
  setTimeout(async () => {
    const wrapper = document.createElement('div');
    wrapper.className = 'wa-msg wa-msg-received';
    wrapper.innerHTML = `
      <div class="wa-msg-bubble">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/></svg> Reserva confirmada! Aqui tienes el resumen:
        <div class="wa-confirmation">
          <div class="wa-conf-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00A884" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline"><path d="M20 6 9 17l-5-5"/></svg> Cita Confirmada</div>
          <div class="wa-conf-row"><span>Servicio</span><span>${selectedService}</span></div>
          <div class="wa-conf-row"><span>Fecha</span><span>${selectedDate}</span></div>
          <div class="wa-conf-row"><span>Hora</span><span>${time}</span></div>
          <div class="wa-conf-row"><span>Salon</span><span>Glamour Studio - Gran Via</span></div>
        </div>
        <div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,.6)">
          Te enviaremos un recordatorio 24h antes. Para cancelar o modificar, escribenos con al menos 4h de antelacion.
        </div>
        <span class="wa-msg-time">10:28</span>
      </div>`;
    waChat.appendChild(wrapper);
    waChat.appendChild(createClearfix());
    scrollChat();
    await addMsg('Necesitas algo mas? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>', 'received', 800);
  }, 1200);
}

const waCanned = [
  'Claro! Estamos encantadas de ayudarte. Nuestro salon esta en Gran Via 42, Madrid. Te esperamos!',
  'Nuestros precios incluyen consulta previa gratuita. Quieres que te enviemos el catalogo completo?',
  'Trabajamos con los mejores productos: Kerastase, OPI, Dermalogica. Tu pelo y piel en las mejores manos.',
  'Tambien tenemos paquetes para novias y eventos especiales. Quieres mas informacion?',
  'Perfecto! Si necesitas cambiar o cancelar tu cita, solo escribenos aqui. Estamos disponibles de 9 a 21h.'
];
let waIdx = 0;

function waSendMessage(){
  const text = waInput.value.trim();
  if(!text)return;
  waInput.value = '';
  addMsg(text, 'sent', 0);
  if(step === 0){
    step = 1;
    setTimeout(async () => {
      await addMsg('Hola! <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9EDEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Bienvenida a <strong>Glamour Studio</strong>. Nos encanta que nos escribas!', 'received', 1000);
      addServiceList();
    }, 500);
  } else {
    const resp = waCanned[waIdx % waCanned.length];
    waIdx++;
    addMsg(resp, 'received', 1200);
  }
}
